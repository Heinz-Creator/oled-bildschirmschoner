blueprint:
  name: OLED Bildschirmschoner – Haushaltsgerät fertig
  description: Erkennt einen Programmlauf über einen Leistungssensor in Watt und schreibt den Status in einen Auswahl-Helfer mit den Optionen Bereit, Läuft und Fertig.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/Heinz-Creator/oled-bildschirmschoner/blob/main/blueprints/geraet-fertig.yaml
  input:
    power_sensor:
      name: Leistungssensor in Watt
      description: Wähle den Leistungssensor des Geräts, zum Beispiel von einer messenden Steckdose.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: power
    status:
      name: Auswahl-Helfer für den Gerätestatus
      description: Der Helfer braucht die Optionen Bereit, Läuft und Fertig.
      selector:
        entity:
          filter:
            - domain: input_select
    running_watts:
      name: Startschwelle in Watt
      default: 15
      selector:
        number:
          min: 1
          max: 2000
          step: 1
          unit_of_measurement: W
          mode: box
    idle_watts:
      name: Leerlaufschwelle in Watt
      default: 3
      selector:
        number:
          min: 0.1
          max: 200
          step: 0.1
          unit_of_measurement: W
          mode: box
    running_minutes:
      name: Mindestzeit über der Startschwelle
      default: 2
      selector:
        number:
          min: 1
          max: 15
          unit_of_measurement: min
          mode: box
    idle_minutes:
      name: Mindestzeit unter der Leerlaufschwelle
      description: Lange genug wählen, damit eine Programmpause noch nicht als Ende zählt.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
          mode: box

mode: queued
triggers:
  - trigger: numeric_state
    id: started
    entity_id: !input power_sensor
    above: !input running_watts
    for:
      minutes: !input running_minutes
  - trigger: numeric_state
    id: finished
    entity_id: !input power_sensor
    below: !input idle_watts
    for:
      minutes: !input idle_minutes
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: started
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input status
            data:
              option: Läuft
      - conditions:
          - condition: trigger
            id: finished
          - condition: state
            entity_id: !input status
            state: Läuft
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input status
            data:
              option: Fertig
